<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="430" viewBox="0 0 1220 430">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1220" height="430" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Wide-and-Deep Recommendation Model</text>

  <rect x="70" y="140" width="230" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="185" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Wide Features</text>
  <text x="185" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">cross features, rules</text>

  <rect x="70" y="270" width="230" height="90" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="185" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Deep Features</text>
  <text x="185" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">embeddings + dense inputs</text>

  <rect x="400" y="140" width="220" height="90" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="510" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">Linear Path</text>
  <text x="510" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">memorization</text>

  <rect x="400" y="270" width="220" height="90" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="510" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">MLP Path</text>
  <text x="510" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">generalization</text>

  <rect x="735" y="205" width="220" height="90" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="845" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">Join</text>
  <text x="845" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">combine both signals</text>

  <rect x="1035" y="215" width="140" height="70" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="1105" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Score</text>

  <path d="M300 185 L400 185" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M300 315 L400 315" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 185 L735 225" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 315 L735 275" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M955 250 L1035 250" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
