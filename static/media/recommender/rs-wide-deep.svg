<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Wide-and-Deep Recommendation Model</text>

  <rect x="70" y="140" width="220" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="180" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Wide Features</text>
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">cross features, rules</text>

  <rect x="70" y="270" width="220" height="90" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="180" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Deep Features</text>
  <text x="180" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">embeddings + dense inputs</text>

  <rect x="390" y="140" width="210" height="90" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="495" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">Linear Path</text>
  <text x="495" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">memorization</text>

  <rect x="390" y="270" width="210" height="90" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="495" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">MLP Path</text>
  <text x="495" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">generalization</text>

  <rect x="720" y="205" width="210" height="90" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="825" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">Join</text>
  <text x="825" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">combine both signals</text>

  <rect x="1010" y="215" width="140" height="70" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="1080" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Score</text>

  <line x1="290" y1="185" x2="390" y2="185" stroke="#475569" stroke-width="3"/>
  <polygon points="390,185 378,179 378,191" fill="#475569"/>
  <line x1="290" y1="315" x2="390" y2="315" stroke="#475569" stroke-width="3"/>
  <polygon points="390,315 378,309 378,321" fill="#475569"/>
  <line x1="600" y1="185" x2="720" y2="225" stroke="#475569" stroke-width="3"/>
  <polygon points="720,225 707,227 711,215" fill="#475569"/>
  <line x1="600" y1="315" x2="720" y2="275" stroke="#475569" stroke-width="3"/>
