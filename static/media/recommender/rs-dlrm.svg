<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="450" viewBox="0 0 1220 450">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1220" height="450" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">DLRM-Style Recommendation Model</text>

  <rect x="60" y="110" width="240" height="100" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="180" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Sparse Features</text>
  <text x="180" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">user IDs, item IDs,</text>
  <text x="180" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">categories</text>

  <rect x="60" y="250" width="240" height="90" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="180" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Dense Features</text>
  <text x="180" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">price, counts, recency</text>

  <rect x="380" y="100" width="230" height="120" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="495" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Embedding Tables</text>
  <text x="495" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">map sparse IDs to vectors</text>

  <rect x="380" y="245" width="230" height="100" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="495" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Bottom MLP</text>
  <text x="495" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">transform dense inputs</text>

  <rect x="700" y="160" width="240" height="120" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="820" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">Feature Interaction</text>
  <text x="820" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">pairwise dot products</text>

  <rect x="980" y="160" width="180" height="120" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1070" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Top MLP</text>
  <text x="1070" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">final prediction</text>

  <path d="M300 160 L380 160" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M300 295 L380 295" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 160 L700 195" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 295 L700 245" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M940 220 L980 220" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
