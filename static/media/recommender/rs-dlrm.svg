<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">DLRM-Style Recommendation Model</text>

  <rect x="60" y="110" width="220" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="170" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Sparse Features</text>
  <text x="170" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">user IDs, item IDs, categories</text>

  <rect x="60" y="240" width="220" height="90" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="170" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Dense Features</text>
  <text x="170" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">price, counts, recency</text>

  <rect x="360" y="100" width="220" height="110" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="470" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Embedding Tables</text>
  <text x="470" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">map sparse IDs to vectors</text>

  <rect x="360" y="235" width="220" height="95" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="470" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Bottom MLP</text>
  <text x="470" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">transform dense inputs</text>

  <rect x="670" y="160" width="220" height="110" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">Feature Interaction</text>
  <text x="780" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">pairwise dot products</text>

  <rect x="960" y="160" width="180" height="110" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1050" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Top MLP</text>
  <text x="1050" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">final prediction</text>

  <line x1="280" y1="155" x2="360" y2="155" stroke="#475569" stroke-width="3"/>
  <polygon points="360,155 348,149 348,161" fill="#475569"/>
  <line x1="280" y1="285" x2="360" y2="285" stroke="#475569" stroke-width="3"/>
  <polygon points="360,285 348,279 348,291" fill="#475569"/>
  <line x1="580" y1="155" x2="670" y2="190" stroke="#475569" stroke-width="3"/>
  <polygon points="670,190 657,192 661,180" fill="#475569"/>
  <line x1="580" y1="285" x2="670" y2="240" stroke="#475569" stroke-width="3"/>
  <polygon points="670,240 661,250 656,239" fill="#475569"/>
  <line x1="890" y1="215" x2="960" y2="215" stroke="#475569" stroke-width="3"/>
  <polygon points="960,215 948,209 948,221" fill="#475569"/>
</svg>
