<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <rect width="1200" height="460" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">User-Item Matrix: Explicit vs Implicit</text>

  <text x="120" y="100" font-family="Arial" font-size="24" fill="#1e3a8a" font-weight="700">Explicit ratings</text>
  <rect x="80" y="120" width="460" height="300" fill="#ffffff" stroke="#94a3b8"/>

  <g font-family="Arial" font-size="22" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">
    <rect x="120" y="160" width="80" height="80" fill="#dbeafe"/><text x="160" y="200">5</text>
    <rect x="200" y="160" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="240" y="200">?</text>
    <rect x="280" y="160" width="80" height="80" fill="#dbeafe"/><text x="320" y="200">2</text>
    <rect x="360" y="160" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="400" y="200">?</text>

    <rect x="120" y="240" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="160" y="280">?</text>
    <rect x="200" y="240" width="80" height="80" fill="#dbeafe"/><text x="240" y="280">4</text>
    <rect x="280" y="240" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="320" y="280">?</text>
    <rect x="360" y="240" width="80" height="80" fill="#dbeafe"/><text x="400" y="280">1</text>

    <rect x="120" y="320" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="160" y="360">?</text>
    <rect x="200" y="320" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="240" y="360">?</text>
    <rect x="280" y="320" width="80" height="80" fill="#dbeafe"/><text x="320" y="360">3</text>
    <rect x="360" y="320" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="400" y="360">?</text>
  </g>

  <text x="700" y="100" font-family="Arial" font-size="24" fill="#14532d" font-weight="700">Implicit interactions</text>
  <rect x="660" y="120" width="460" height="300" fill="#ffffff" stroke="#94a3b8"/>

  <g font-family="Arial" font-size="22" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">
    <rect x="700" y="160" width="80" height="80" fill="#dcfce7"/><text x="740" y="200">1</text>
    <rect x="780" y="160" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="820" y="200">0</text>
    <rect x="860" y="160" width="80" height="80" fill="#dcfce7"/><text x="900" y="200">1</text>
    <rect x="940" y="160" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="980" y="200">0</text>

    <rect x="700" y="240" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="740" y="280">0</text>
    <rect x="780" y="240" width="80" height="80" fill="#dcfce7"/><text x="820" y="280">1</text>
    <rect x="860" y="240" width="80" height="80" fill="#dcfce7"/><text x="900" y="280">1</text>
    <rect x="940" y="240" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="980" y="280">0</text>

    <rect x="700" y="320" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="740" y="360">0</text>
    <rect x="780" y="320" width="80" height="80" fill="#dcfce7"/><text x="820" y="360">1</text>
    <rect x="860" y="320" width="80" height="80" fill="#ffffff" stroke="#e2e8f0"/><text x="900" y="360">0</text>
    <rect x="940" y="320" width="80" height="80" fill="#dcfce7"/><text x="980" y="360">1</text>
  </g>
</svg>
