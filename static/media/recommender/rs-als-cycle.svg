<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="380" viewBox="0 0 1220 380">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1220" height="380" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Alternating Least Squares (ALS)</text>

  <rect x="90" y="110" width="250" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="215" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Fix Q</text>
  <text x="215" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">solve for user factors P</text>

  <rect x="485" y="110" width="250" height="90" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="610" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Fix P</text>
  <text x="610" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">solve for item factors Q</text>

  <rect x="880" y="110" width="250" height="90" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1005" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9a3412">Repeat</text>
  <text x="1005" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">until convergence</text>

  <path d="M340 155 L485 155" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M735 155 L880 155" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <path d="M1005 200 C 1145 260, 255 320, 215 205" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="610" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">alternate updates over</text>
  <text x="610" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">sparse matrix data</text>
</svg>
