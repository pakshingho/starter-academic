<svg width="1240" height="660" viewBox="0 0 1240 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Two-tower extensions</title>
  <desc id="desc">A comparison of base two-tower retrieval, DAT augmentation, and IntTower style interaction enhancements.</desc>
  <defs>
    <marker id="arrowGray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1240" height="660" fill="#f8fafc"/>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Interaction-Enhanced Variants</text>
  <text x="50" y="92" font-family="Arial, sans-serif" font-size="18" fill="#475569">The base two-tower is efficient but loses fine-grained cross-feature interactions. Extensions try to recover part of that signal without giving up retrieval speed.</text>

  <rect x="40" y="130" width="360" height="460" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="220" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Base Two-Tower</text>
  <rect x="85" y="220" width="120" height="200" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="145" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">User</text>
  <text x="145" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">tower</text>
  <rect x="235" y="220" width="120" height="200" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="295" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Item</text>
  <text x="295" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">tower</text>
  <circle cx="220" cy="320" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">u · v</text>
  <text x="82" y="470" font-family="Arial, sans-serif" font-size="18" fill="#475569">Late interaction happens only at the final score.</text>
  <text x="82" y="500" font-family="Arial, sans-serif" font-size="18" fill="#475569">Pros: fast retrieval and fully decoupled serving.</text>
  <text x="82" y="530" font-family="Arial, sans-serif" font-size="18" fill="#b91c1c">Weakness: limited cross-feature interaction.</text>

  <rect x="440" y="130" width="360" height="460" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="620" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">DAT</text>
  <text x="620" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Dual Augmented Two-Tower</text>
  <rect x="485" y="230" width="120" height="190" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <rect x="640" y="230" width="120" height="190" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="545" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">User</text>
  <text x="545" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">tower + aᵤ</text>
  <text x="700" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Item</text>
  <text x="700" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">tower + aᵥ</text>
  <rect x="540" y="448" width="160" height="60" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">cross-history</text>
  <path d="M620 448 L620 420" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="470" y="532" font-family="Arial, sans-serif" font-size="18" fill="#475569">Adds historical positive signals from the opposite side</text>
  <text x="505" y="560" font-family="Arial, sans-serif" font-size="18" fill="#475569">to enrich each tower input before retrieval.</text>

  <rect x="840" y="130" width="360" height="460" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1020" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">IntTower</text>
  <rect x="875" y="225" width="120" height="74" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="935" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Light-SE</text>
  <rect x="1045" y="225" width="120" height="74" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="1105" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">FE block</text>
  <rect x="958" y="338" width="120" height="74" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1018" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">CIR</text>
  <path d="M995 262 L1045 262" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M1105 299 L1078 338" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M958 375 L915 299" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/>
  <text x="870" y="460" font-family="Arial, sans-serif" font-size="18" fill="#475569">Light-SE recalibrates feature importance.</text>
  <text x="870" y="488" font-family="Arial, sans-serif" font-size="18" fill="#475569">FE block adds fine-grained early interaction.</text>
  <text x="870" y="516" font-family="Arial, sans-serif" font-size="18" fill="#475569">CIR adds contrastive regularization for positives.</text>
  <text x="870" y="548" font-family="Arial, sans-serif" font-size="18" fill="#475569">Related late-interaction ideas keep decoupling while</text>
  <text x="870" y="576" font-family="Arial, sans-serif" font-size="18" fill="#475569">preserving richer token-level matching.</text>
</svg>
