<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Metric tree</title>
  <desc id="desc">A metric hierarchy connecting business outcome, north star metric, supporting behavior metrics, and guardrails.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf5; }
      .title { font: 700 33px Georgia, serif; fill: #1f2d2a; }
      .card { stroke: #26433b; stroke-width: 3; fill: #fff; rx: 22; }
      .top { fill: #d8eee3; }
      .mid { fill: #dbe8f6; }
      .left { fill: #f8dfc5; }
      .center { fill: #ede5f7; }
      .right { fill: #f3d9da; }
      .guard { fill: #f6f2e8; }
      .label { font: 700 23px Georgia, serif; fill: #1f2d2a; }
      .body { font: 17px 'Helvetica Neue', Arial, sans-serif; fill: #334743; }
      .arrow { stroke: #26433b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="3.8" markerHeight="3.8" refX="3.2" refY="1.9" orient="auto">
      <path d="M0,0 L3.8,1.9 L0,3.8 z" fill="#26433b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="740"/>
  <text class="title" x="600" y="56" text-anchor="middle">From Business Goal to Usable Metrics</text>

  <g transform="translate(405 92)">
    <rect class="card top" width="390" height="98" rx="22"/>
    <text class="label" x="195" y="42" text-anchor="middle">Business Outcome</text>
    <text class="body" x="195" y="74" text-anchor="middle">Growth, efficiency, trust, or retention</text>
  </g>

  <g transform="translate(380 248)">
    <rect class="card mid" width="440" height="110" rx="22"/>
    <text class="label" x="220" y="44" text-anchor="middle">North Star Metric</text>
    <text class="body" x="220" y="78" text-anchor="middle">One main measure of user value or team success</text>
  </g>

  <g transform="translate(860 248)">
    <rect class="card guard" width="260" height="110" rx="22"/>
    <text class="label" x="130" y="40" text-anchor="middle">Guardrails</text>
    <text class="body" x="130" y="72" text-anchor="middle">
      <tspan x="130" dy="0">latency, abuse, support load,</tspan>
      <tspan x="130" dy="22">cancellations</tspan>
    </text>
  </g>

  <g transform="translate(85 560)">
    <rect class="card left" width="290" height="116" rx="22"/>
    <text class="label" x="145" y="46" text-anchor="middle">Acquisition / Activation</text>
    <text class="body" x="145" y="80" text-anchor="middle">arrival, signup, first value</text>
  </g>

  <g transform="translate(455 560)">
    <rect class="card center" width="290" height="116" rx="22"/>
    <text class="label" x="145" y="46" text-anchor="middle">Engagement / Retention</text>
    <text class="body" x="145" y="80" text-anchor="middle">repeat usage, depth, habit</text>
  </g>

  <g transform="translate(825 560)">
    <rect class="card right" width="290" height="116" rx="22"/>
    <text class="label" x="145" y="46" text-anchor="middle">Revenue / Efficiency</text>
    <text class="body" x="145" y="80" text-anchor="middle">margin, cost, throughput</text>
  </g>

  <path class="arrow" d="M600 190 V236"/>
  <path class="arrow" d="M820 303 H856"/>
  <path d="M600 358 V454 H970" stroke="#26433b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 454 H600" stroke="#26433b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="arrow" d="M230 454 V548"/>
  <path class="arrow" d="M600 454 V548"/>
  <path class="arrow" d="M970 454 V548"/>
</svg>
