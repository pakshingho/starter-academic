<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Probability map for common data science situations</title>
  <desc id="desc">A diagram mapping common data-generating stories to useful probability distributions and Bayes updating.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf5; }
      .title { font: 700 33px Georgia, serif; fill: #1f2d2a; }
      .card { stroke: #26433b; stroke-width: 3; fill: #fff; rx: 20; }
      .c1 { fill: #d9efe4; }
      .c2 { fill: #f7e1c8; }
      .c3 { fill: #dbe8f6; }
      .c4 { fill: #f4dcdd; }
      .c5 { fill: #ede6f7; }
      .label { font: 700 24px Georgia, serif; fill: #1f2d2a; }
      .body { font: 17px 'Helvetica Neue', Arial, sans-serif; fill: #334743; }
      .small { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #4a5f5a; }
      .formula { font: 17px Menlo, Consolas, monospace; fill: #334743; }
      .arrow { stroke: #26433b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="3.8" markerHeight="3.8" refX="3.2" refY="1.9" orient="auto">
      <path d="M0,0 L3.8,1.9 L0,3.8 z" fill="#26433b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="600" y="58" text-anchor="middle">Choose the Model by the Story Behind the Data</text>

  <g transform="translate(60 110)">
    <rect class="card c1" width="240" height="176" rx="20"/>
    <text class="label" x="120" y="50" text-anchor="middle">Binary Outcome</text>
    <text class="body" x="120" y="94" text-anchor="middle">Did the user convert?</text>
    <text class="body" x="120" y="126" text-anchor="middle">Did the alert fire?</text>
    <text class="small" x="120" y="156" text-anchor="middle">Bernoulli or Binomial</text>
  </g>

  <g transform="translate(330 110)">
    <rect class="card c2" width="240" height="176" rx="20"/>
    <text class="label" x="120" y="50" text-anchor="middle">Count in Window</text>
    <text class="body" x="120" y="94" text-anchor="middle">Orders this hour</text>
    <text class="body" x="120" y="126" text-anchor="middle">Tickets this day</text>
    <text class="small" x="120" y="156" text-anchor="middle">Poisson</text>
  </g>

  <g transform="translate(600 110)">
    <rect class="card c3" width="240" height="176" rx="20"/>
    <text class="label" x="120" y="50" text-anchor="middle">Continuous Noise</text>
    <text class="body" x="120" y="94" text-anchor="middle">Measurement error</text>
    <text class="body" x="120" y="126" text-anchor="middle">Averages over many effects</text>
    <text class="small" x="120" y="156" text-anchor="middle">Normal approximation</text>
  </g>

  <g transform="translate(870 110)">
    <rect class="card c4" width="240" height="176" rx="20"/>
    <text class="label" x="120" y="50" text-anchor="middle">Waiting Time</text>
    <text class="body" x="120" y="94" text-anchor="middle">Time until arrival</text>
    <text class="body" x="120" y="126" text-anchor="middle">Time until failure</text>
    <text class="small" x="120" y="156" text-anchor="middle">Exponential</text>
  </g>

  <g transform="translate(240 398)">
    <rect class="card c5" width="720" height="194" rx="20"/>
    <text class="label" x="360" y="50" text-anchor="middle">Update Beliefs with New Evidence</text>
    <text class="body" x="360" y="96" text-anchor="middle">Start with a prior belief.</text>
    <text class="body" x="360" y="126" text-anchor="middle">Combine it with the likelihood of the new evidence.</text>
    <text class="body" x="360" y="156" text-anchor="middle">Update to a posterior belief with Bayes' rule.</text>
    <text class="formula" x="360" y="182" text-anchor="middle">P(A | B) = P(B | A) P(A) / P(B)</text>
  </g>

  <path class="arrow" d="M180 292 V374"/>
  <path class="arrow" d="M450 292 V374"/>
  <path class="arrow" d="M720 292 V374"/>
  <path class="arrow" d="M990 292 V374"/>
</svg>
