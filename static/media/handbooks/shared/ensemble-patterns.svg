<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bagging versus boosting</title>
  <desc id="desc">A side-by-side comparison of bagging as parallel averaging and boosting as sequential error correction.</desc>
  <defs>
    <style>
      .bg { fill: #fbf6ee; }
      .panel { fill: #ffffff; stroke: #d9c9b4; stroke-width: 2; rx: 18; }
      .soft { fill: #dcefeb; }
      .accent { fill: #145b52; }
      .warm { fill: #d68435; }
      .purple { fill: #7a4f92; }
      .label { font: 700 24px "Helvetica Neue", Arial, sans-serif; fill: #1f2624; }
      .body { font: 700 20px "Helvetica Neue", Arial, sans-serif; fill: #2f3e39; }
      .note { font: 500 15px "Helvetica Neue", Arial, sans-serif; fill: #5f6d67; }
      .arrow { stroke: #145b52; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#145b52"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="360" rx="24"/>
  <text x="40" y="42" class="label">Two ensemble patterns to know</text>

  <g transform="translate(40 74)">
    <rect class="panel" width="520" height="246" rx="18"/>
    <text x="24" y="34" class="body">Bagging: parallel averaging</text>
    <rect x="24" y="62" width="108" height="46" rx="14" class="soft" stroke="#145b52" stroke-width="2"/>
    <text x="78" y="90" text-anchor="middle" class="note">Dataset</text>
    <path class="arrow" d="M 138 85 H 182"/>
    <rect x="190" y="54" width="110" height="42" rx="14" class="soft" stroke="#145b52" stroke-width="2"/>
    <rect x="190" y="104" width="110" height="42" rx="14" class="soft" stroke="#145b52" stroke-width="2"/>
    <rect x="190" y="154" width="110" height="42" rx="14" class="soft" stroke="#145b52" stroke-width="2"/>
    <text x="245" y="80" text-anchor="middle" class="note">Bootstrap 1</text>
    <text x="245" y="130" text-anchor="middle" class="note">Bootstrap 2</text>
    <text x="245" y="180" text-anchor="middle" class="note">Bootstrap 3</text>
    <path class="arrow" d="M 306 75 H 350"/>
    <path class="arrow" d="M 306 125 H 350"/>
    <path class="arrow" d="M 306 175 H 350"/>
    <rect x="360" y="52" width="70" height="46" rx="14" class="accent"/>
    <rect x="360" y="102" width="70" height="46" rx="14" class="accent"/>
    <rect x="360" y="152" width="70" height="46" rx="14" class="accent"/>
    <text x="395" y="82" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tree</text>
    <text x="395" y="132" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tree</text>
    <text x="395" y="182" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tree</text>
    <path class="arrow" d="M 436 75 H 476"/>
    <path class="arrow" d="M 436 125 H 476"/>
    <path class="arrow" d="M 436 175 H 476"/>
    <rect x="480" y="100" width="28" height="48" rx="10" class="warm"/>
    <text x="246" y="220" class="note">Variance reduction through averaging</text>
    <text x="246" y="240" class="note">less-correlated learners</text>
  </g>

  <g transform="translate(640 74)">
    <rect class="panel" width="520" height="246" rx="18"/>
    <text x="24" y="34" class="body">Boosting: sequential correction</text>
    <rect x="24" y="98" width="80" height="44" rx="14" class="soft" stroke="#145b52" stroke-width="2"/>
    <text x="64" y="126" text-anchor="middle" class="note">Start</text>
    <path class="arrow" d="M 110 120 H 152"/>
    <rect x="160" y="84" width="78" height="72" rx="14" class="accent"/>
    <text x="199" y="118" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tree 1</text>
    <text x="199" y="138" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ffffff">fit</text>
    <path class="arrow" d="M 244 120 H 286"/>
    <rect x="294" y="84" width="78" height="72" rx="14" class="warm"/>
    <text x="333" y="118" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tree 2</text>
    <text x="333" y="138" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ffffff">fix residuals</text>
    <path class="arrow" d="M 378 120 H 420"/>
    <rect x="428" y="84" width="78" height="72" rx="14" class="purple"/>
    <text x="467" y="118" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tree 3</text>
    <text x="467" y="138" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ffffff">refine again</text>
    <text x="24" y="210" class="note">Bias reduction through additive</text>
    <text x="24" y="230" class="note">updates under a chosen loss</text>
  </g>
</svg>
