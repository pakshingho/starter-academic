<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Train, validation, and test split</title>
  <desc id="desc">A simple timeline-style diagram showing train, validation, and test segments and what each is used for.</desc>
  <defs>
    <style>
      .bg { fill: #fbf6ee; }
      .train { fill: #145b52; }
      .valid { fill: #d68435; }
      .test { fill: #7a4f92; }
      .label { font: 700 24px "Helvetica Neue", Arial, sans-serif; fill: #1f2624; }
      .body { font: 500 18px "Helvetica Neue", Arial, sans-serif; fill: #2f3e39; }
      .note { font: 500 16px "Helvetica Neue", Arial, sans-serif; fill: #5f6d67; }
      .card { fill: #ffffff; stroke: #d9c9b4; stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="260" rx="24"/>
  <text x="40" y="44" class="label">One workflow, three roles</text>

  <rect x="40" y="86" width="670" height="46" rx="23" class="train"/>
  <rect x="710" y="86" width="220" height="46" rx="23" class="valid"/>
  <rect x="930" y="86" width="230" height="46" rx="23" class="test"/>

  <text x="320" y="116" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Train</text>
  <text x="820" y="116" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Validation</text>
  <text x="1045" y="116" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Test</text>

  <g transform="translate(40 152)">
    <rect class="card" width="320" height="88" rx="18"/>
    <text x="20" y="28" class="body">Fit parameters</text>
    <text x="20" y="54" class="note">Used repeatedly during training</text>
  </g>

  <g transform="translate(430 152)">
    <rect class="card" width="320" height="88" rx="18"/>
    <text x="20" y="28" class="body">Choose features and models</text>
    <text x="20" y="54" class="note">Used to compare workflow</text>
    <text x="20" y="74" class="note">decisions</text>
  </g>

  <g transform="translate(820 152)">
    <rect class="card" width="340" height="88" rx="18"/>
    <text x="20" y="28" class="body">Estimate final generalization</text>
    <text x="20" y="54" class="note">Touched only after the</text>
    <text x="20" y="74" class="note">workflow is fixed</text>
  </g>
</svg>
