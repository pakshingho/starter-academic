<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Economies of scale and network effects</title>
  <desc id="desc">A two-panel diagram comparing the supply-side flywheel of economies of scale with the demand-side flywheel of network effects.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .title { font: 700 34px Georgia, serif; fill: #20312d; }
      .subtitle { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #50655f; }
      .panel { fill: #fff; stroke: #26433b; stroke-width: 3; rx: 28; }
      .panelTitle { font: 700 28px Georgia, serif; fill: #20312d; }
      .card { stroke: #26433b; stroke-width: 2.5; rx: 18; }
      .left1 { fill: #d8eee3; }
      .left2 { fill: #eaf4ed; }
      .right1 { fill: #dbe8f6; }
      .right2 { fill: #edf4fb; }
      .body { font: 17px 'Helvetica Neue', Arial, sans-serif; fill: #344744; }
      .note { font: 15px 'Helvetica Neue', Arial, sans-serif; fill: #50655f; }
      .arrow { stroke: #26433b; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .callout { fill: #f6f0e2; stroke: #26433b; stroke-width: 2.5; rx: 20; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.4" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#26433b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="58" text-anchor="middle">Why Platforms Can Scale So Fast</text>
  <text class="subtitle" x="600" y="90" text-anchor="middle">Supply-side cost advantages and demand-side value creation often reinforce each other.</text>

  <g transform="translate(52 136)">
    <rect class="panel" width="520" height="500" rx="28"/>
    <text class="panelTitle" x="260" y="50" text-anchor="middle">Economies of Scale</text>
    <text class="subtitle" x="260" y="82" text-anchor="middle">Supply-side flywheel</text>

    <rect class="card left1" x="52" y="128" width="168" height="104" rx="18"/>
    <text class="body" x="136" y="164" text-anchor="middle">
      <tspan x="136" dy="0">More output</tspan>
      <tspan x="136" dy="22">or usage</tspan>
    </text>

    <rect class="card left2" x="300" y="128" width="168" height="104" rx="18"/>
    <text class="body" x="384" y="164" text-anchor="middle">
      <tspan x="384" dy="0">Fixed costs</tspan>
      <tspan x="384" dy="22">spread wider</tspan>
    </text>

    <rect class="card left1" x="300" y="272" width="168" height="104" rx="18"/>
    <text class="body" x="384" y="308" text-anchor="middle">
      <tspan x="384" dy="0">Lower average</tspan>
      <tspan x="384" dy="22">cost</tspan>
    </text>

    <rect class="card left2" x="52" y="272" width="168" height="104" rx="18"/>
    <text class="body" x="136" y="298" text-anchor="middle">
      <tspan x="136" dy="0">More room</tspan>
      <tspan x="136" dy="22">to reinvest</tspan>
      <tspan x="136" dy="22">or cut price</tspan>
    </text>

    <path class="arrow" d="M220 180 H282"/>
    <path class="arrow" d="M384 232 V256"/>
    <path class="arrow" d="M300 324 H238"/>
    <path class="arrow" d="M136 272 V242"/>

    <g transform="translate(40 406)">
      <rect class="callout" width="440" height="62" rx="20"/>
      <text class="note" x="220" y="26" text-anchor="middle">
        <tspan x="220" dy="0">Examples: cloud software, logistics, payments,</tspan>
        <tspan x="220" dy="20">and other high-fixed-cost systems.</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(628 136)">
    <rect class="panel" width="520" height="500" rx="28"/>
    <text class="panelTitle" x="260" y="50" text-anchor="middle">Network Effects</text>
    <text class="subtitle" x="260" y="82" text-anchor="middle">Demand-side flywheel</text>

    <rect class="card right1" x="52" y="128" width="168" height="104" rx="18"/>
    <text class="body" x="136" y="164" text-anchor="middle">
      <tspan x="136" dy="0">More users</tspan>
      <tspan x="136" dy="22">join</tspan>
    </text>

    <rect class="card right2" x="300" y="128" width="168" height="104" rx="18"/>
    <text class="body" x="384" y="164" text-anchor="middle">
      <tspan x="384" dy="0">More liquidity,</tspan>
      <tspan x="384" dy="22">content, or data</tspan>
    </text>

    <rect class="card right1" x="300" y="272" width="168" height="104" rx="18"/>
    <text class="body" x="384" y="308" text-anchor="middle">
      <tspan x="384" dy="0">Higher user</tspan>
      <tspan x="384" dy="22">value</tspan>
    </text>

    <rect class="card right2" x="52" y="272" width="168" height="104" rx="18"/>
    <text class="body" x="136" y="298" text-anchor="middle">
      <tspan x="136" dy="0">More retention</tspan>
      <tspan x="136" dy="22">and acquisition</tspan>
    </text>

    <path class="arrow" d="M220 180 H282"/>
    <path class="arrow" d="M384 232 V256"/>
    <path class="arrow" d="M300 324 H238"/>
    <path class="arrow" d="M136 272 V242"/>

    <g transform="translate(40 406)">
      <rect class="callout" width="440" height="62" rx="20"/>
      <text class="note" x="220" y="26" text-anchor="middle">
        <tspan x="220" dy="0">Examples: marketplaces, app stores, social</tspan>
        <tspan x="220" dy="20">networks, and messaging products.</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(170 664)">
    <rect class="callout" width="860" height="70" rx="20"/>
    <text class="note" x="430" y="28" text-anchor="middle">
      <tspan x="430" dy="0">When both loops are strong, platforms can scale fast and tip markets.</tspan>
      <tspan x="430" dy="20">Multi-homing, differentiation, and regulation can still keep markets contestable.</tspan>
    </text>
  </g>
</svg>
