<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Trust loop in an online market</title>
  <desc id="desc">A circular flow showing how identity, safety systems, and richer signals reinforce trust and market participation.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .title { font: 700 34px Georgia, serif; fill: #20312d; }
      .subtitle { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #50655f; }
      .ring { fill: none; stroke: #d4dfd8; stroke-width: 16; }
      .card { stroke: #26433b; stroke-width: 2.5; rx: 18; }
      .c1 { fill: #d8eee3; }
      .c2 { fill: #dbe8f6; }
      .c3 { fill: #f8e0c7; }
      .c4 { fill: #f3d9da; }
      .c5 { fill: #e9e3f7; }
      .body { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #334743; }
      .small { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #50655f; }
      .arrow { stroke: #26433b; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .center { fill: #f6f0e2; stroke: #26433b; stroke-width: 2.5; rx: 28; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.4" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#26433b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="740"/>
  <text class="title" x="600" y="56" text-anchor="middle">Trust Loop for Online Markets</text>
  <text class="subtitle" x="600" y="88" text-anchor="middle">Platforms grow more safely when trust systems improve participation and generate better signals.</text>

  <circle class="ring" cx="600" cy="392" r="220"/>

  <g transform="translate(390 140)">
    <rect class="card c1" width="420" height="96" rx="18"/>
    <text class="body" x="210" y="42" text-anchor="middle">Identity, guarantees, and</text>
    <text class="body" x="210" y="68" text-anchor="middle">clear platform rules</text>
  </g>

  <g transform="translate(826 294)">
    <rect class="card c2" width="256" height="98" rx="18"/>
    <text class="body" x="128" y="43" text-anchor="middle">More trustworthy</text>
    <text class="body" x="128" y="69" text-anchor="middle">transactions</text>
  </g>

  <g transform="translate(700 538)">
    <rect class="card c3" width="350" height="100" rx="18"/>
    <text class="body" x="175" y="43" text-anchor="middle">Richer signals: reviews, returns,</text>
    <text class="body" x="175" y="69" text-anchor="middle">disputes, messages, and timing</text>
  </g>

  <g transform="translate(150 538)">
    <rect class="card c4" width="350" height="100" rx="18"/>
    <text class="body" x="175" y="43" text-anchor="middle">Better ranking, screening,</text>
    <text class="body" x="175" y="69" text-anchor="middle">and enforcement</text>
  </g>

  <g transform="translate(118 294)">
    <rect class="card c5" width="256" height="98" rx="18"/>
    <text class="body" x="128" y="43" text-anchor="middle">More buyer and seller</text>
    <text class="body" x="128" y="69" text-anchor="middle">confidence</text>
  </g>

  <path class="arrow" d="M810 188 C900 196 955 236 964 286"/>
  <path class="arrow" d="M954 392 C968 468 932 520 874 530"/>
  <path class="arrow" d="M700 588 H516"/>
  <path class="arrow" d="M326 538 C228 522 182 470 172 398"/>
  <path class="arrow" d="M246 294 C270 220 322 186 390 188"/>

  <g transform="translate(392 330)">
    <rect class="center" width="416" height="120" rx="28"/>
    <text class="body" x="208" y="46" text-anchor="middle">Trust is part of matching quality,</text>
    <text class="body" x="208" y="72" text-anchor="middle">repeat usage, and monetization.</text>
    <text class="small" x="208" y="98" text-anchor="middle">Thin signals like average stars are often too crude on their own.</text>
  </g>
</svg>
