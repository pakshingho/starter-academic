<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Observed growth versus incremental growth</title>
  <desc id="desc">A flow chart showing how marketing spend leads to observed conversions, but only some conversions are incremental and should be used for CAC and ROI.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .title { font: 700 34px Georgia, serif; fill: #20312d; }
      .subtitle { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #50655f; }
      .card { stroke: #26433b; stroke-width: 2.5; rx: 20; }
      .c1 { fill: #dbe8f6; }
      .c2 { fill: #d8eee3; }
      .c3 { fill: #f8e0c7; }
      .c4 { fill: #f3d9da; }
      .c5 { fill: #e9e3f7; }
      .label { font: 700 21px Georgia, serif; fill: #20312d; }
      .body { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #334743; }
      .small { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #50655f; }
      .arrow { stroke: #26433b; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.4" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#26433b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="740"/>
  <text class="title" x="600" y="58" text-anchor="middle">Observed Growth Is Not the Same as Incremental Growth</text>
  <text class="subtitle" x="600" y="90" text-anchor="middle">Platform CAC and ROI should be based on caused outcomes, not all post-campaign activity.</text>

  <g transform="translate(60 220)">
    <rect class="card c1" width="220" height="128" rx="20"/>
    <text class="label" x="110" y="46" text-anchor="middle">
      <tspan x="110" dy="0">Marketing</tspan>
      <tspan x="110" dy="22">Spend</tspan>
    </text>
    <text class="body" x="110" y="92" text-anchor="middle">Coupons, search, ads,</text>
    <text class="body" x="110" y="118" text-anchor="middle">referrals, promos</text>
  </g>

  <g transform="translate(340 220)">
    <rect class="card c2" width="250" height="128" rx="20"/>
    <text class="label" x="125" y="46" text-anchor="middle">
      <tspan x="125" dy="0">Observed</tspan>
      <tspan x="125" dy="22">Signups</tspan>
    </text>
    <text class="body" x="125" y="92" text-anchor="middle">All exposed conversions</text>
    <text class="body" x="125" y="118" text-anchor="middle">look attributable</text>
  </g>

  <g transform="translate(670 116)">
    <rect class="card c3" width="250" height="136" rx="20"/>
    <text class="label" x="125" y="38" text-anchor="middle">
      <tspan x="125" dy="0">Would Have</tspan>
      <tspan x="125" dy="22">Happened</tspan>
    </text>
    <text class="body" x="125" y="92" text-anchor="middle">Organic, habitual,</text>
    <text class="body" x="125" y="118" text-anchor="middle">or already-intentful</text>
  </g>

  <g transform="translate(670 352)">
    <rect class="card c4" width="250" height="136" rx="20"/>
    <text class="label" x="125" y="38" text-anchor="middle">
      <tspan x="125" dy="0">Incremental</tspan>
      <tspan x="125" dy="22">Users</tspan>
    </text>
    <text class="body" x="125" y="92" text-anchor="middle">Lift caused by the</text>
    <text class="body" x="125" y="118" text-anchor="middle">campaign itself</text>
  </g>

  <g transform="translate(970 356)">
    <rect class="card c5" width="180" height="128" rx="20"/>
    <text class="label" x="90" y="46" text-anchor="middle">True CAC</text>
    <text class="body" x="90" y="86" text-anchor="middle">Spend divided by</text>
    <text class="body" x="90" y="112" text-anchor="middle">incremental users</text>
  </g>

  <path class="arrow" d="M280 284 H323"/>
  <path class="arrow" d="M590 270 C642 270 644 184 662 184"/>
  <path class="arrow" d="M590 306 C642 306 644 420 662 420"/>
  <path class="arrow" d="M920 420 H953"/>

  <g transform="translate(160 570)">
    <rect class="card" width="880" height="112" rx="20" fill="#f6f0e2"/>
    <text class="small" x="440" y="42" text-anchor="middle">
      <tspan x="440" dy="0">If the campaign brings in 10,000 signups but only 2,000 are incremental,</tspan>
      <tspan x="440" dy="24">naive CAC can look five times better than the true causal CAC.</tspan>
      <tspan x="440" dy="24">That is the core measurement trap in platform growth.</tspan>
    </text>
  </g>
</svg>
